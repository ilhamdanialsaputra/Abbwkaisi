name: Render HTML ke MP4

on:
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ambil file dari repository
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pasang Playwright, Chromium, dan FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Siapkan video demo (demo1-4.mp4 -> webm, supaya bisa di-seek per frame)
        run: |
          for i in 1 2 3 4; do
            if [ -f "demo$i.mp4" ]; then
              ffmpeg -y -i "demo$i.mp4" -an -vf "scale=1080:-2" -c:v libvpx -g 1 -crf 8 -b:v 12M "demo$i.webm"
            else
              echo "demo$i.mp4 tidak ada, dilewati"
            fi
          done

      - name: Render frame demi frame jadi MP4 60fps
        run: node render.js

      - name: Simpan MP4 ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dinduy-ad-mp4
          path: dinduy-ad.mp4
